<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do Lists</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- Mobile top bar -->
  <header class="topbar">
    <button id="sidebar-toggle" class="topbar-btn" aria-label="Toggle sidebar">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <h1 class="topbar-title">To-Do Lists</h1>
  </header>

  <!-- Overlay for mobile sidebar -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <div class="app-layout">

    <!-- ── Left sidebar ── -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h2>My Lists</h2>
      </div>

      <form id="add-list-form" class="sidebar-form">
        <input type="text" id="new-list-name" placeholder="New list…" required>
        <button type="submit" class="icon-btn add-btn" aria-label="Add list">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </form>

      <ul id="list-items" class="nav-list"></ul>
    </aside>

    <!-- ── Right main content ── -->
    <main id="main-content" class="main-content">

      <!-- Empty / welcome state -->
      <div id="welcome-state" class="welcome-state">
        <div class="welcome-icon">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#b0b8c9" stroke-width="1.2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        </div>
        <p>Select a list or create a new one to get started.</p>
      </div>

      <!-- Tasks panel (hidden until a list is selected) -->
      <div id="tasks-view" class="tasks-view" hidden>
        <div class="tasks-header">
          <h2 id="tasks-title" class="tasks-title"></h2>
          <div class="tasks-header-actions">
            <button id="edit-list-btn" class="icon-btn" aria-label="Rename list">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button id="delete-list-btn" class="icon-btn danger" aria-label="Delete list">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
            </button>
          </div>
        </div>

        <form id="add-task-form" class="add-task-form">
          <input type="text" id="new-task-title" placeholder="Add a task…" required>
          <button type="submit" class="btn btn-primary">Add</button>
        </form>

        <ul id="task-items" class="task-list"></ul>
      </div>

    </main>
  </div>

  <!-- Rename list modal -->
  <div id="rename-modal" class="modal-backdrop" hidden>
    <div class="modal">
      <h3>Rename List</h3>
      <form id="rename-list-form">
        <input type="text" id="rename-list-input" required>
        <div class="modal-actions">
          <button type="button" id="rename-cancel" class="btn btn-ghost">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
