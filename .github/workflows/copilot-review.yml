name: Copilot Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  copilot-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitHub Copilot CLI
        env:
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: gh extension install github/gh-copilot --force

      - name: Review PR changes with Copilot CLI
        env:
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e

          # Get the full PR diff
          DIFF=$(gh pr diff "$PR_NUMBER")

          if [ -z "$DIFF" ]; then
            echo "No changes detected in PR."
            exit 0
          fi

          # Save diff to a temp file for processing
          echo "$DIFF" > /tmp/pr_diff.patch

          # Get list of changed files
          CHANGED_FILES=$(gh pr diff "$PR_NUMBER" --name-only)

          REVIEW=""

          for FILE in $CHANGED_FILES; do
            # Extract the diff for this file
            FILE_DIFF=$(awk "/^diff --git a\/${FILE//\//\\/} /,/^diff --git /{if (/^diff --git / && !/a\/${FILE//\//\\/} /) exit; print}" /tmp/pr_diff.patch)

            if [ -z "$FILE_DIFF" ]; then
              continue
            fi

            # Truncate very large diffs to stay within CLI limits
            TRUNCATED_DIFF=$(echo "$FILE_DIFF" | head -200)

            # Use gh copilot explain to review the file diff
            FILE_REVIEW=$(gh copilot explain \
              "Review this code diff for bugs, security vulnerabilities, performance issues, and code quality. Provide specific, actionable recommendations. Here is the diff for file ${FILE}: ${TRUNCATED_DIFF}" 2>&1) || true

            if [ -n "$FILE_REVIEW" ]; then
              REVIEW="${REVIEW}### \`${FILE}\`
          ${FILE_REVIEW}

          ---

          "
            fi
          done

          if [ -z "$REVIEW" ]; then
            echo "No review comments generated."
            exit 0
          fi

          # Post the aggregated review as a PR comment
          COMMENT_BODY="## 🤖 GitHub Copilot CLI Code Review

          ${REVIEW}

          > _This review was automatically generated by GitHub Copilot CLI._"

          echo "$COMMENT_BODY" | gh pr comment "$PR_NUMBER" --body-file -

          echo "Review posted successfully."
